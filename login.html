<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="canonical" href="https://unlockvip.co.tz/login.html">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #0f1117, #020202);
    color: #fff;
    font-family: Arial, sans-serif;
  }
  form {
    width: min(420px, calc(100% - 32px));
    background: #1a1d24;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,.7);
  }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p { margin: 0 0 18px; color: #b7b7b7; }
  label { display: block; text-align: left; margin: 14px 0 6px; font-size: 14px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
  }
  button {
    width: 100%;
    margin-top: 18px;
    background: #ff3c00;
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 22px; margin-top: 14px; font-size: 14px; }
  .err { color: #ff8d7a; }
  .ok { color: #8dffb0; }
  a { color: #ffb199; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Login</h1>
  <p>Enter your phone number and password.</p>
  <label for="phone">Phone number</label>
  <input id="phone" name="phone" type="text" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="07XXXXXXXX" pattern="[0-9]*">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn" type="submit">Login</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
const API_HOST = "https://unlockvip-backend-1.onrender.com";
const phone = document.getElementById("phone");
const password = document.getElementById("password");
const msg = document.getElementById("msg");
const loginBtn = document.getElementById("loginBtn");

function apiBase() {
  var h = location.hostname.toLowerCase();
  if (
    h === "unlockvip.co.tz" ||
    h === "www.unlockvip.co.tz" ||
    h === "unlockvip-frontend.onrender.com" ||
    h === "unlockvip-backend-1.onrender.com"
  ) return "";
  return API_HOST;
}

function keepDigits(input) {
  const clean = input.value.replace(/\D/g, "");
  if (input.value !== clean) input.value = clean;
}

phone.addEventListener("beforeinput", (event) => {
  if (event.data && /\D/.test(event.data)) event.preventDefault();
});
phone.addEventListener("input", () => keepDigits(phone));
phone.addEventListener("paste", (event) => {
  event.preventDefault();
  const text = (event.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
  phone.value = (phone.value + text).replace(/\D/g, "").slice(0, 12);
});

function say(text, ok) {
  msg.textContent = text;
  msg.className = "msg " + (ok ? "ok" : "err");
}

document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  keepDigits(phone);
  const phoneValue = phone.value;
  const passwordValue = password.value;
  if (!/^\d{10}$/.test(phoneValue) && !/^\d{12}$/.test(phoneValue)) {
    say("Enter the phone number with digits only.");
    return;
  }
  if (!passwordValue) {
    say("Enter your password.");
    return;
  }
  loginBtn.disabled = true;
  say("Checking login...", true);
  try {
    const response = await fetch(apiBase() + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phoneValue, password: passwordValue })
    });
    const result = await response.json();
    if (result.success) {
      say("Logged in.", true);
      return;
    }
    say(result.error || "Login failed");
  } catch (error) {
    say("Server error");
  } finally {
    loginBtn.disabled = false;
  }
});
</script>
</body>
</html>
