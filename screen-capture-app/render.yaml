# Render.com — deploy screen-capture-app as one web service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: screen-capture-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: NODE_ENV=production node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
